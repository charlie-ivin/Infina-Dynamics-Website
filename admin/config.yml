# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: charlie-ivin/Infina-Dynamics-Website
  branch: main
  # base_url: https://your-worker.workers.dev  # optional OAuth proxy

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Site Content
    files:
      - name: homepage
        label: Homepage Content
        file: content/site.json
        fields:
          - label: Hero Title
            name: hero_title
            widget: text
            hint: Use <br> for line breaks if needed
          - label: Hero Subtitle
            name: hero_subtitle
            widget: text

          - label: About Section Title
            name: about_title
            widget: string
          - label: About Paragraph 1
            name: about_p1
            widget: text
          - label: About Paragraph 2
            name: about_p2
            widget: text
          - label: About Quote
            name: about_quote
            widget: string
          - label: Stat 1 Number
            name: stat1_num
            widget: string
          - label: Stat 1 Label
            name: stat1_label
            widget: string
          - label: Stat 2 Number
            name: stat2_num
            widget: string
          - label: Stat 2 Label
            name: stat2_label
            widget: string
          - label: Stat 3 Number
            name: stat3_num
            widget: string
          - label: Stat 3 Label
            name: stat3_label
            widget: string

          - label: Services Section Title
            name: services_title
            widget: string
          - label: Services Description
            name: services_desc
            widget: text
          - label: Service 1 Title
            name: service1_title
            widget: string
          - label: Service 1 Description
            name: service1_desc
            widget: text
          - label: Service 2 Title
            name: service2_title
            widget: string
          - label: Service 2 Description
            name: service2_desc
            widget: text
          - label: Service 3 Title
            name: service3_title
            widget: string
          - label: Service 3 Description
            name: service3_desc
            widget: text
          - label: Service 4 Title
            name: service4_title
            widget: string
          - label: Service 4 Description
            name: service4_desc
            widget: text

          - label: Portfolio Section Title
            name: portfolio_title
            widget: string
          - label: Portfolio Description
            name: portfolio_desc
            widget: text
          - label: Project 1 Title
            name: port1_title
            widget: string
          - label: Project 2 Title
            name: port2_title
            widget: string
          - label: Project 3 Title
            name: port3_title
            widget: string
          - label: Project 4 Title
            name: port4_title
            widget: string

          - label: CTA Title
            name: cta_title
            widget: string
          - label: CTA Description
            name: cta_desc
            widget: text

          - label: Contact Section Title
            name: contact_title
            widget: string
          - label: Contact Intro
            name: contact_intro
            widget: text
          - label: Contact Email
            name: contact_email
            widget: string
          - label: Contact Location
            name: contact_location
            widget: string

          - label: Footer Tagline
            name: footer_tagline
            widget: string
