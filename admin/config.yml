# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: charlie-ivin/Infina-Dynamics-Website
  branch: main
  # base_url: https://your-worker.workers.dev

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Site Content
    files:
      - name: homepage
        label: Homepage Content
        file: content/site.json
        fields:
          - label: Hero Title
            name: hero_title
            widget: text
            hint: Use <br> for line breaks if needed
          - label: Hero Subtitle
            name: hero_subtitle
            widget: text
          - label: Hero Banner Image
            name: hero_banner
            widget: image
            hint: Large background image on the homepage hero
          - label: Site Logo
            name: site_logo
            widget: image
            hint: Used in navbar, about section, and footer

          - label: About Section Title
            name: about_title
            widget: string
          - label: About Paragraph 1
            name: about_p1
            widget: text
          - label: About Paragraph 2
            name: about_p2
            widget: text
          - label: About Quote
            name: about_quote
            widget: string
          - label: Stat 1 Number
            name: stat1_num
            widget: string
          - label: Stat 1 Label
            name: stat1_label
            widget: string
          - label: Stat 2 Number
            name: stat2_num
            widget: string
          - label: Stat 2 Label
            name: stat2_label
            widget: string
          - label: Stat 3 Number
            name: stat3_num
            widget: string
          - label: Stat 3 Label
            name: stat3_label
            widget: string

          - label: Services Section Title
            name: services_title
            widget: string
          - label: Services Description
            name: services_desc
            widget: text
          - label: Services
            name: services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Description
                name: desc
                widget: text
              - label: Icon
                name: icon
                widget: select
                options:
                  - { label: Layers (Branding), value: layers }
                  - { label: Image (Graphic), value: image }
                  - { label: Arrow Up (Concept), value: arrow-up }
                  - { label: Home (Themed), value: home }
                  - { label: Star, value: star }
                  - { label: Sparkles, value: sparkles }
                  - { label: Palette, value: palette }
                  - { label: Pen, value: pen }

          - label: Portfolio Section Title
            name: portfolio_title
            widget: string
          - label: Portfolio Description
            name: portfolio_desc
            widget: text
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Tag
                name: tag
                widget: string
              - label: Image
                name: image
                widget: image

          - label: CTA Title
            name: cta_title
            widget: string
          - label: CTA Description
            name: cta_desc
            widget: text

          - label: Contact Section Title
            name: contact_title
            widget: string
          - label: Contact Intro
            name: contact_intro
            widget: text
          - label: Contact Cards
            name: contact_items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - label: Label
                name: label
                widget: string
                hint: e.g. Email, Location, Phone
              - label: Value
                name: value
                widget: string
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Email (clickable mailto), value: email }
                  - { label: Text, value: text }
                  - { label: Phone (clickable tel), value: phone }
                  - { label: Link (URL), value: link }

          - label: Footer Email
            name: footer_email
            widget: string
          - label: Footer Tagline
            name: footer_tagline
            widget: string
